name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: logscan-linux-x86_64
          - os: macos-latest
            name: logscan-macos-arm64
          - os: windows-latest
            name: logscan-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install . pyinstaller
      - run: pyinstaller --onefile --name logscan --console scripts/logscan_entry.py
      - name: Rename binary
        shell: bash
        run: |
          src=dist/logscan; [ -f dist/logscan.exe ] && src=dist/logscan.exe
          mv "$src" "dist/${{ matrix.name }}"
          "dist/${{ matrix.name }}" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  publish:
    needs: [binaries, package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
